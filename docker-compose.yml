# Local development stack. Usage: `make dev` (or `docker compose up --build`).
#
#   http://localhost         Keygate UI (Next.js)        via gateway
#   http://localhost/api     Keygate API (FastAPI)       via gateway
#   http://localhost:8025    Mailpit (captured emails)
#
# Only the gateway and Mailpit UI are exposed for browsing; Postgres and Redis are
# published on 127.0.0.1 only, so host-run tests can reach them but the LAN cannot.

name: keygate

x-api-env: &api-env
  KEYGATE_ENVIRONMENT: ${KEYGATE_ENVIRONMENT:-development}
  KEYGATE_LOG_LEVEL: ${KEYGATE_LOG_LEVEL:-INFO}
  KEYGATE_LOG_JSON: ${KEYGATE_LOG_JSON:-false}
  KEYGATE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-keygate}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-keygate}
  KEYGATE_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  KEYGATE_SECRET_KEY: ${KEYGATE_SECRET_KEY:?set KEYGATE_SECRET_KEY in .env}
  KEYGATE_PUBLIC_URL: ${KEYGATE_PUBLIC_URL:-http://localhost}
  KEYGATE_WEBAUTHN_RP_ID: ${KEYGATE_WEBAUTHN_RP_ID:-localhost}
  KEYGATE_WEBAUTHN_ORIGINS: '["${KEYGATE_PUBLIC_URL:-http://localhost}"]'
  KEYGATE_SMTP_HOST: mailpit
  # Social login: a provider is enabled only when both its ID and secret are set.
  KEYGATE_GITHUB_CLIENT_ID: ${KEYGATE_GITHUB_CLIENT_ID:-}
  KEYGATE_GITHUB_CLIENT_SECRET: ${KEYGATE_GITHUB_CLIENT_SECRET:-}
  KEYGATE_GOOGLE_CLIENT_ID: ${KEYGATE_GOOGLE_CLIENT_ID:-}
  KEYGATE_GOOGLE_CLIENT_SECRET: ${KEYGATE_GOOGLE_CLIENT_SECRET:-}
  KEYGATE_SMTP_PORT: "1025"

services:
  gateway:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-80}:80"
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.42.10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: dev
    # Dev start-up: sync deps, migrate, register the Notes demo client, then serve.
    command:
      - sh
      - -c
      - >-
        uv sync --frozen &&
        alembic upgrade head &&
        python -m keygate.cli ensure-client --client-id "$$NOTES_CLIENT_ID" --name "Notes (demo)"
        --secret-env NOTES_CLIENT_SECRET
        --redirect-uri http://127.0.0.1:3001/api/auth/callback
        --post-logout-redirect-uri http://127.0.0.1:3001/
        --scopes "openid profile email notes:read notes:write" &&
        exec uvicorn keygate.main:create_app --factory --host 0.0.0.0 --port 8000
        --reload --reload-dir src --no-access-log
    environment:
      <<: *api-env
      NOTES_CLIENT_ID: ${NOTES_CLIENT_ID:-notes-demo}
      NOTES_CLIENT_SECRET: ${NOTES_CLIENT_SECRET:?set NOTES_CLIENT_SECRET in .env}
      # Served behind the gateway at /api; only trust X-Forwarded-For from the gateway.
      UVICORN_ROOT_PATH: /api
      FORWARDED_ALLOW_IPS: 172.30.42.10
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
      # Dependency changes are picked up by `uv sync` at container start, no rebuild.
      - ./apps/api/pyproject.toml:/app/pyproject.toml:ro
      - ./apps/api/uv.lock:/app/uv.lock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      # Keep the container's own node_modules and build cache, not the host's.
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # Demo relying party: signs in through Keygate with OpenID Connect. Served on a
  # different cookie host (127.0.0.1, not localhost), so Keygate's cookies never reach it.
  demo-notes:
    build:
      context: ./apps/demo-notes
      target: dev
    environment:
      WATCHPACK_POLLING: "true"
      KEYGATE_ISSUER: ${KEYGATE_PUBLIC_URL:-http://localhost}
      KEYGATE_INTERNAL_URL: http://gateway
      NOTES_BASE_URL: http://127.0.0.1:3001
      NOTES_CLIENT_ID: ${NOTES_CLIENT_ID:-notes-demo}
      NOTES_CLIENT_SECRET: ${NOTES_CLIENT_SECRET:?set NOTES_CLIENT_SECRET in .env}
      NOTES_SESSION_SECRET: ${NOTES_SESSION_SECRET:?set NOTES_SESSION_SECRET in .env}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./apps/demo-notes:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keygate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-keygate}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # redis-cli reads the password from here, keeping it out of `ps` output.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.42.0/24

volumes:
  pgdata:
  redisdata:

# Keygate CI: lint + types, tests (unit/integration/E2E), security scans, image builds.
# Third-party actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps
# them current. The workflow token is read-only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  # ------------------------------------------------------------------ lint/types
  api-lint:
    name: API · lint & types
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { enable-cache: true, cache-dependency-glob: apps/api/uv.lock }
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  web-lint:
    name: ${{ matrix.app }} · lint & types
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { app: [web, demo-notes] }
    defaults: { run: { working-directory: "apps/${{ matrix.app }}" } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: "apps/${{ matrix.app }}/package.json" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: "apps/${{ matrix.app }}/pnpm-lock.yaml"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  # ----------------------------------------------------------------------- tests
  api-test:
    name: API · tests & coverage
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_USER: keygate, POSTGRES_PASSWORD: keygate-ci, POSTGRES_DB: keygate }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keygate" --health-interval 5s --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.8.3-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      KEYGATE_DATABASE_URL: postgresql+asyncpg://keygate:keygate-ci@localhost:5432/keygate
      KEYGATE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { enable-cache: true, cache-dependency-glob: apps/api/uv.lock }
      - run: uv sync
      - name: pytest (coverage gate 80%)
        run: >-
          uv run pytest --cov --cov-report=term --cov-report=xml --cov-report=markdown:coverage.md
          --cov-fail-under=80
      - name: Coverage summary
        if: always()
        run: test -f coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: api-coverage, path: apps/api/coverage.xml, if-no-files-found: ignore }

  e2e:
    name: E2E · full stack + virtual WebAuthn authenticator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Production runtime images instead of dev bind-mounts (see docker-compose.ci.yml).
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Start the stack (docker compose, development values)
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Smoke tests (production build of the UI)
        working-directory: apps/web
        run: pnpm test
      - name: End-to-end tests (passkeys via CDP virtual authenticator, OIDC with Notes)
        working-directory: apps/web
        run: pnpm test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color > stack.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            stack.log
          if-no-files-found: ignore

  # -------------------------------------------------------------------- security
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }

      - name: Gitleaks (full git history)
        env: { GITLEAKS_VERSION: 8.30.1 }
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep linux_x64.tar.gz "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Semgrep (SAST)
        run: >-
          uvx semgrep@1.180.0 scan --metrics=off --error
          --config p/python --config p/typescript --config p/react --config p/owasp-top-ten
          --config p/secrets --config p/dockerfile .

      - name: pip-audit (Python dependencies)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit@2.10.1 -r requirements.txt --no-deps --disable-pip --strict

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: apps/web/package.json }
      - name: pnpm audit (production dependencies)
        run: |
          for app in web demo-notes; do
            (cd "apps/$app" && pnpm audit --prod --audit-level high)
          done

      - name: Trivy (dependencies, secrets, IaC misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    name: Image · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: api, port: 8000, path: /health }
          - { app: web, port: 3000, path: / }
          - { app: demo-notes, port: 3000, path: / }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image
        run: docker buildx build --load --target runtime -t "keygate-${{ matrix.app }}:ci" "apps/${{ matrix.app }}"
      - name: Trivy (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "keygate-${{ matrix.app }}:ci"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke-run the image (non-root, starts, serves)
        run: |
          docker run -d --name app -p 127.0.0.1:9000:${{ matrix.port }} \
            -e NOTES_CLIENT_ID=ci -e NOTES_CLIENT_SECRET=ci -e NOTES_SESSION_SECRET=ci \
            "keygate-${{ matrix.app }}:ci"
          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:9000${{ matrix.path }}" -o /dev/null && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:9000${{ matrix.path }}" -o /dev/null
          test "$(docker exec app id -u)" != "0"
          docker logs app | tail -20

  # Single required check for branch protection.
  ci-ok:
    name: CI passed
    if: always()
    needs: [api-lint, web-lint, api-test, e2e, security, images]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more jobs failed." && exit 1
          fi

[project]
name = "keygate"
version = "0.1.0"
description = "Keygate: passkey-first authentication service"
authors = [
    { name = "HariprasadG92", email = "hariprasad9122002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "authlib>=1.8.0",
    "fastapi>=0.143.0",
    "joserfc>=1.7.5",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.0",
    "pyotp>=2.10.0",
    "redis>=8.1.0",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cbor2>=6.1.5",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-authlib>=1.8.0.20260911",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "PTH", "TID",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests
"src/keygate/db/migrations/**" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["keygate", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["keygate"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# Weekly dependency updates, grouped per ecosystem to keep PR noise down.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { web: { patterns: ["*"] } }

  - package-ecosystem: npm
    directory: /apps/demo-notes
    schedule: { interval: weekly }
    groups: { demo-notes: { patterns: ["*"] } }

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/demo-notes]
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
